<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>WorkerPowerCalc</title>
    <link rel="stylesheet" href="stili.css" />
</head>

<body>
    <h1>Web Workers testing</h1>
    <div class="controls" tabindex="0">
        <form>
            <h2>Calcolo della potenza di un numero (x elevato a y)</h2>
            <div>
                <label for="x">x: </label>
                <input type="text" id="x" value="0" />
            </div>
            <div>
                <label for="y">y: </label>
                <input type="text" id="y" value="0" />
            </div>
        </form>
        <p class="result">risultato: 0</p>
    </div>
    <script src="main.js"></script>
</body>

</html>
